apiVersion: fincrime.dev/v1
kind: FinCrimeSkill

metadata:
  name: alert-triage
  version: 1.0.0
  status: draft
  owners:
    - "@fincrime-maintainers"
  license: Apache-2.0
  jurisdiction_scope:
    - US
  created: "2026-10-21"
  contract_version: fincrime/finding/1.0.0
  knowledge_pack: core-2026-10
  related_skills: investigation-qa,case-summarize,evidence-request

spec:
  purpose: >-
    Take a raw alert and the transaction and customer evidence behind it and
    produce a triage finding: the evidence inventory built before anything is
    asserted, the indicator matches named from core-2026-10, a benign reading
    beside every adverse reading, a risk assessment stated at the level the
    evidence supports, and the gaps that block a conclusion. Never disposes
    of an alert and never reaches a conclusion about a customer.

  inputs:
    required:
      - name: alert
        description: The raw alert that opened the review, with what was detected and against which subject.
      - name: evidence_set
        description: The closed world of transaction, account, customer and document records the triage may cite.
        contract_ref: fincrime/evidence-set/1.0.0
      - name: threshold_policy
        description: The currency transaction reporting threshold in force for the monitoring window, and the date it changed. A policy input, never a value written into the skill.
    optional:
      - name: knowledge_index
        description: The knowledge pack used to resolve indicator ids, their benign explanations and their dates.
      - name: policy_rules
        description: The firm's deterministic rules, used to check enforceable controls.
      - name: prior_findings
        description: Earlier triage or case artifacts for the same subject, where they exist.

  preconditions:
    - id: PC-1
      check: "the alert and the evidence set are supplied"
      on_fail: stop
      message: "There is nothing to triage without the alert and the evidence behind it."
    - id: PC-2
      check: "the evidence set is closed and every source carries a stable source id"
      on_fail: stop
      message: "Evidence attribution cannot be checked against an open or unaddressable evidence set."
    - id: PC-3
      check: "the reporting threshold in force for the monitoring window is supplied as a policy input"
      on_fail: stop
      message: "A threshold written into the skill would be a stale claim. Supply the value in force for the window."
    - id: PC-4
      check: "the declared knowledge pack is resolvable"
      on_fail: annotate
      message: "Indicator existence and freshness cannot be verified; disclose it."

  procedure:
    - stage: S0
      name: frame
      produces: [frame]
      requires: []
    - stage: S1
      name: ground
      produces: [evidence_inventory, gaps]
      requires: [evidence_set]
      guard: POL-EVIDENCE-INVENTORY-FIRST
      on_violation: stop
    - stage: S2
      name: extract
      produces: [observation, indicator]
      requires: [evidence_inventory]
      guard: POL-INDICATOR-REQUIRES-INDICATOR-ID
      on_violation: stop
    - stage: S3
      name: hypothesize
      produces: [hypothesis]
      requires: [claim_set]
      guard: POL-BENIGN-HYPOTHESIS-REQUIRED
      on_violation: stop
    - stage: S4
      name: contrast
      produces: [contradiction]
      requires: [claim_set]
    - stage: S5
      name: assess
      produces: [risk_assessment]
      requires: [gap_list]
      guard: POL-ASSESSMENT-NEEDS-INDICATOR
    - stage: S6
      name: recommend
      produces: [recommendation]
      requires: [claim_set]
      guard: POL-RECOMMENDATION-NEEDS-BASIS
    - stage: S7
      name: escalate
      produces: [escalation]
      requires: [claim_set]

  output:
    format: fincrime/finding/1.0.0
    artifact: triage_report
    required_claims:
      - frame
      - evidence_inventory
      - gaps
      - observation
      - indicator
      - hypothesis
      - risk_assessment
      - recommendation
    optional_claims:
      - contradiction
      - escalation
    prohibited_claims:
      - decision
    min_hypotheses: 2
    require_benign_hypothesis: true
    confidence:
      levels:
        - high
        - moderate
        - low
        - insufficient_information
      default_ceiling: moderate

  policies:
    required:
      - POL-EVIDENCE-INVENTORY-FIRST
      - POL-INDICATOR-REQUIRES-INDICATOR-ID
      - POL-BENIGN-HYPOTHESIS-REQUIRED
      - POL-ASSESSMENT-NEEDS-INDICATOR
      - POL-RECOMMENDATION-NEEDS-BASIS
      - POL-NO-CRIMINALITY-CLAIMS
    optional:
      - POL-CONFIDENCE-CEILING-ON-PARTIAL-EVIDENCE

  knowledge:
    indicators:
      - IND-STRUCT-THRESHOLD-PROXIMITY
      - IND-FAST-MOVEMENT-PASS-THROUGH
      - IND-ROUND-AMOUNT-DEPOSIT-CLUSTER
    scenarios: []
    typologies:
      - TYP-STRUCTURING-SMURFING
      - TYP-MULE-ACCOUNT-NETWORK
      - TYP-ACCOUNT-TAKEOVER-LAUNDERING
      - TYP-ELDER-FINANCIAL-EXPLOITATION
    regulatory:
      - REG-STRUCTURING-1010-100
      - REG-CTR-1010-311

  evaluation:
    suite: evals/suites/alert-triage
    case_count_min: 60
    gates:
      schema_validity: 1.0
      evidence_attribution_accuracy: 0.98
      unsupported_claim_rate_max: 0.02
      required_field_compliance: 1.0
      policy_pass_rate: 1.0
      expected_defect_recall: 0.9
      false_defect_rate_max: 0.05

  safety:
    human_approval_required:
      - recommendation
      - escalation
    prohibited_actions:
      - customer_action
      - filing
      - legal_conclusion
      - numeric_risk_rating
      - alert_disposition
      - artifact_rewrite
    closed_world: true
    pii_policy: reference_only
