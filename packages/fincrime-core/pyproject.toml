[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "fincrime-core"
version = "0.1.0"
description = "The Evidence-Linked Finding contract, validator, policy evaluator and knowledge engine for financial-crime AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "fincrime-skills maintainers" }]
keywords = ["aml", "fincrime", "kyc", "sanctions", "agent-skills", "audit", "evidence"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Typing :: Typed",
]

# INVARIANT (ADR-0002): fincrime-core has ZERO required runtime dependencies.
# The trust boundary of a bank deployment must be dependency-free and must not
# have network capability. Enforced by scripts/check_imports.py in CI.
dependencies = []

[project.optional-dependencies]
# Optional typed-validation ergonomics for consumers who want them. Generated
# from the same JSON Schemas so the two representations cannot drift.
pydantic = ["pydantic>=2.6,<3"]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.urls]
Homepage = "https://github.com/fincrime/fincrime-skills"
Documentation = "https://github.com/fincrime/fincrime-skills/tree/main/docs"
Issues = "https://github.com/fincrime/fincrime-skills/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/fincrime_core"]

# The canonical contracts live at the repository root so that adapters, docs,
# and the CLI all reference one copy. They are also shipped inside the wheel
# so that a standalone install works with no repository present -- the
# validator must be usable in an air-gapped environment, and a package that
# cannot find its own contract cannot validate anything.
[tool.hatch.build.targets.wheel.force-include]
"../../contracts" = "fincrime_core/_contracts"

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "tests",
    "README.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["src/fincrime_core"]
