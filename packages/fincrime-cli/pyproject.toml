[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "fincrime-cli"
version = "0.1.0"
description = "The fincrime command: scaffold, validate, and inspect financial-crime skills and their contracts."
readme = "README.md"
requires-python = ">=3.10"
license = { "text" = "Apache-2.0" }
authors = [{ name = "fincrime-skills maintainers" }]
keywords = ["aml", "fincrime", "agent-skills", "cli", "validator"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]

# The CLI is stdlib-only at runtime, for the same reason the core is: it runs
# in the environments that need it, including air-gapped ones (ADR-0002).
dependencies = ["fincrime-core>=0.1.0"]

[project.optional-dependencies]
# PyYAML is a dev-only dependency. It is used by the parity test that proves
# this package's YAML subset parser agrees with a reference implementation,
# exactly as `jsonschema` is used by the schema-parity check.
dev = ["pytest>=7.4", "pyyaml>=6.0"]

[project.scripts]
fincrime = "fincrime_cli.main:main"

[project.urls]
Homepage = "https://github.com/fincrime/fincrime-skills"
Documentation = "https://github.com/fincrime/fincrime-skills/tree/main/docs"
Issues = "https://github.com/fincrime/fincrime-skills/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/fincrime_cli"]

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "tests",
    "README.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
